services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bash -c "rm -f tmp/pids/server.pid && ./bin/rails server -b 0.0.0.0 -p 4500"
    env_file:
      - .env
    environment:
      DB_HOST: db
    ports:
      - "4500:4500"
    volumes:
      - .:/rails
      - bundle:/usr/local/bundle
    depends_on:
      - db
      - redis

  sidekiq:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bundle exec sidekiq -C config/sidekiq.yml
    env_file:
      - .env
    environment:
      DB_HOST: db
    volumes:
      - .:/rails
      - bundle:/usr/local/bundle
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis:/data

volumes:
  bundle:
  postgres:
  redis:
